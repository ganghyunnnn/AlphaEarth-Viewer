[project]
name = "alphaearth-viewer-backend"
version = "0.1.0"
description = "FastAPI app + TiTiler dynamic tiles + DuckDB remote index queries"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "titiler.core>=0.18",
    "titiler.mosaic>=0.18",
    "duckdb>=1.1",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "network: tests that need remote parquet access (run: pytest -m network)",
]
addopts = "-m 'not network'"
