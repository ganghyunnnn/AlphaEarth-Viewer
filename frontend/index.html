<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlphaEarth Embedding Explorer</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="map"></div>
    <!-- 비교 모드 전용: 맵 A 위에 겹쳐지는 두 번째 맵(우측 노출, clip-path로 분할) -->
    <div id="mapB"></div>

    <!-- 분할 경계 + 드래그 핸들 (비교 모드에서만 표시) -->
    <div id="divider"><div class="grip">⇆</div></div>

    <!-- 각 분할면 식별 배지 (비교 모드에서만 표시) -->
    <div id="badgeA" class="mapbadge a">A</div>
    <div id="badgeB" class="mapbadge b">B</div>

    <header id="topbar">
      <strong data-i18n="appTitle">AlphaEarth Embedding Explorer</strong>
      <span class="sub" data-i18n="appSub">64 bands → RGB · gray-code scrub</span>
      <!-- 지명/좌표 검색(접기 가능: 🔍 토글로 입력창 펼침) -->
      <div id="searchBox" class="searchbox collapsed">
        <button type="button" id="searchToggle" class="search-btn search-arrow" data-i18n-title="searchTitle" title="Search">▾</button>
        <form id="searchForm" class="search" autocomplete="off">
          <input id="searchInput" type="text" data-i18n-ph="searchPlaceholder"
                 placeholder="Search place or lat, lng" />
          <div id="searchResults" class="search-results" hidden></div>
        </form>
      </div>
    </header>

    <!-- 언어 토글(EN ↔ 한국어) -->
    <button id="langToggle" class="lang-toggle" title="Language">한국어</button>

    <!-- 베이스맵(레이어) 선택 — 우측 플로팅 -->
    <div id="basemapTabs" class="basemap-ctl">
      <span class="basemap-cap" data-i18n="basemap">Basemap</span>
      <button type="button" class="seg-btn" data-bm="dark" data-i18n="bmDark">Dark</button>
      <button type="button" class="seg-btn" data-bm="satellite" data-i18n="bmSatellite">Satellite</button>
      <button type="button" class="seg-btn" data-bm="osm">OSM</button>
    </div>

    <section id="panel">
      <div class="panel-head">
        <span class="title" data-i18n="panelTitle">Controls</span>
        <!-- 편집 대상 선택(비교 모드에서만 표시) -->
        <div id="sideTabs" class="side-tabs" hidden>
          <button id="tabA" class="side-tab a on" data-side="A">A</button>
          <button id="tabB" class="side-tab b" data-side="B">B</button>
        </div>
        <button id="collapse" class="collapse" data-i18n-title="collapseTitle" title="Collapse / expand panel" aria-expanded="true">▾</button>
      </div>

      <div class="panel-body">
        <div class="row">
          <label data-i18n="year">Year</label>
          <input id="year" type="range" min="2017" max="2025" step="1" value="2024" />
          <output id="yearOut">2024</output>
        </div>

        <div class="row">
          <label data-i18n="bandCombo">Band combo</label>
          <input id="scrub" type="range" min="0" max="262143" step="1" value="0" />
        </div>
        <div class="row combo">
          <label class="bandchip r">R&nbsp;A<input id="bandR" class="bandnum" type="number" min="0" max="63" step="1" /></label>
          <label class="bandchip g">G&nbsp;A<input id="bandG" class="bandnum" type="number" min="0" max="63" step="1" /></label>
          <label class="bandchip b">B&nbsp;A<input id="bandB" class="bandnum" type="number" min="0" max="63" step="1" /></label>
          <label class="idx">#<input id="idxIn" class="idxnum" type="number" min="0" max="262143" step="1" /><span id="idxDup" class="dup"></span></label>
        </div>

        <div class="row">
          <label data-i18n="contrast">Contrast (min/max)</label>
          <input id="rmin" type="range" min="-127" max="0" step="1" value="-50" />
          <input id="rmax" type="range" min="0" max="127" step="1" value="50" />
          <span class="rangeout">
            <input id="rminNum" class="rnum" type="number" min="-127" max="0" step="1" />
            <span class="tilde">~</span>
            <input id="rmaxNum" class="rnum" type="number" min="0" max="127" step="1" />
          </span>
        </div>

        <div class="row">
          <label data-i18n="opacity">Opacity</label>
          <button id="aefToggle" type="button" class="aef-toggle on" aria-pressed="true"
                  data-i18n-title="aefToggleTitle" title="Toggle AlphaEarth layer">ON</button>
          <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" />
          <output id="opacityOut">100%</output>
        </div>

        <div class="row buttons">
          <button id="play" data-i18n-title="playTitle" title="Auto morph">▶ Play</button>
          <button id="skipDeg" class="toggle" data-i18n="skipDup" data-i18n-title="skipDupTitle" title="Skip degenerate frames">Skip duplicates</button>
          <button id="compare" class="toggle" data-i18n="compare" data-i18n-title="compareTitle" title="Side-by-side compare">⇆ Compare</button>
          <button id="bookmark" data-i18n="bookmark" data-i18n-title="bookmarkTitle" title="Pin current combo">📌 Bookmark</button>
          <button id="share" data-i18n="share" data-i18n-title="shareTitle" title="Copy current state URL">🔗 Share</button>
        </div>

        <div id="filmstrip" class="row filmstrip"></div>
        <div id="bookmarks" class="row bookmarks"></div>
      </div>
    </section>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
