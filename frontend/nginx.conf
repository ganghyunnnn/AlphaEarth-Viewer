server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA static files
    location / {
        try_files $uri /index.html;
    }

    # Backend API/tile proxy
    # Cold tile renders merge remote COGs on the fly and take 12-40s.
    # nginx's default proxy_read_timeout (60s) would 504 on first paint/scrub -> be generous.
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /cog/ {
        proxy_pass http://backend:8000;
    }
    location /mosaicjson/ {
        proxy_pass http://backend:8000;
    }
}
