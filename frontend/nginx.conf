server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA 정적 파일
    location / {
        try_files $uri /index.html;
    }

    # 백엔드 API/타일 프록시
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /cog/ {
        proxy_pass http://backend:8000;
    }
    location /mosaicjson/ {
        proxy_pass http://backend:8000;
    }
}
