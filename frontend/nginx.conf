server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA 정적 파일
    location / {
        try_files $uri /index.html;
    }

    # 백엔드 API/타일 프록시
    # 콜드 타일 렌더는 원격 COG를 즉석 병합하느라 12~40s 걸린다.
    # nginx 기본 proxy_read_timeout(60s)이면 첫 화면/스크럽 직후 504로 끊긴다 → 넉넉히.
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /cog/ {
        proxy_pass http://backend:8000;
    }
    location /mosaicjson/ {
        proxy_pass http://backend:8000;
    }
}
